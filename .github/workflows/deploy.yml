# Builds the site and publishes it to GitHub Pages on every push to main.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tell Bing (and other IndexNow search engines) about every page. A failure here never fails the deploy.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: |
          KEY=$(node -e 'import("./src/config.mjs").then(m=>console.log(m.SITE.indexNowKey||""))')
          [ -n "$KEY" ] || exit 0
          URLS=$(jq -R . public/urls.txt | jq -sc .)
          curl -sS -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"kakehashi.au\",\"key\":\"$KEY\",\"keyLocation\":\"https://kakehashi.au/$KEY.txt\",\"urlList\":$URLS}"
